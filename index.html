<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF5EA">
<title>Yumeverse 夢次元記帳｜UI 測試版</title>
<style>
:root{
  --cream:#FBF5EA;--white:#fff;--ink:#3B322C;--soft:#7A6F66;--line:#E8DCCB;
  --pink:#E8477F;--pinkDeep:#C42A62;--pinkLight:#F9C8DB;--pinkPale:#FDEDF3;
  --green:#7FA03F;--greenDeep:#5A7A2C;--greenPale:#EDF2DC;
  --blue:#79B0DC;--blueDeep:#376C95;--bluePale:#E9F4FC;
  --orange:#F3A23F;--orangeDeep:#A95D1E;--orangePale:#FFF1DD;
  --danger:#C65353;--dangerPale:#FBE7E7;--gray:#9A918A;--grayPale:#F1ECE6;
  --line2:#00A64F;
  --font:"Taipei Sans TC Beta","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#EDE6DA;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(121,176,220,.6);outline-offset:2px}
.hidden{display:none!important}

/* ===== 測試工具列（App 外） ===== */
.testbar{flex:none;position:relative;z-index:500;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:#3B322C;color:#fff;font-size:13px}
.testbar b{font-weight:900;margin-right:4px}
.testbar .seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.testbar .seg button{border:0;background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-weight:800}
.testbar .seg button.on{background:#fff;color:var(--ink)}
.testbar .tbtn{border:0;border-radius:999px;padding:7px 12px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
.testbar .tbtn.pink{background:var(--pink)}
.testbar .spacer{flex:1}
@media(max-width:480px){.testbar{gap:6px;padding:6px 8px;font-size:12px}.testbar b{display:none}.testbar .seg button{padding:5px 9px}.testbar .tbtn{padding:6px 9px}}

/* ===== App 外框 ===== */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:0}
.stage.framed{padding:20px 12px 40px;overflow:auto}
.device{position:relative;width:100%;height:100%;background:var(--cream);overflow:hidden;display:flex;flex-direction:column}
.stage.framed .device{border-radius:36px;border:10px solid #2a2420;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.stage.iphone .device{width:390px;height:min(844px,calc(100vh - 106px))}
.stage.ipad .device{width:min(1024px,100%);height:min(768px,calc(100vh - 106px));border-radius:28px}

/* ===== 共用元件 ===== */
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.page{padding:16px;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page.narrow{max-width:680px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 24px rgba(146,104,76,.08)}
.card.tight{padding:10px}
.title{font-size:19px;font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
.title .count{font-size:13px;color:#fff;background:var(--ink);border-radius:999px;padding:1px 8px}
.title .count.zero{background:var(--gray)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--soft)}
.small{font-size:12px}
.sub{font-size:14px}
.strong{font-weight:900}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.divider{height:1px;background:var(--line);margin:4px 0}
.btn{border:0;border-radius:999px;min-height:52px;padding:0 18px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .1s}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pinkDeep)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--greenDeep)}
.btn.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger-outline{background:#fff;color:var(--danger);border:1.5px solid var(--line)}
.btn:disabled{background:#C9C1BB!important;box-shadow:none!important;color:#fff;cursor:not-allowed;border-color:transparent}
.btn.secondary:disabled{background:#f4f1ec!important;color:var(--gray)}
.cbtn{border:0;border-radius:999px;min-height:44px;padding:0 14px;font-weight:900;font-size:14px}
.cbtn.green{background:var(--green);color:#fff}
.cbtn.pinkline{background:var(--pinkPale);color:var(--pinkDeep)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--soft);border-radius:999px;min-height:40px;padding:0 14px;font-weight:900;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip .n{opacity:.75;margin-left:4px}
.pchip{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;min-height:48px;padding:4px 16px 4px 6px;font-weight:900}
.pchip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.pchip .meta{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.pchip .meta small{font-size:11px;opacity:.8;font-weight:700}
.avatar{flex:none;display:grid;place-items:center;border-radius:12px;font-weight:900;color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;white-space:nowrap}
.b-green{background:var(--greenPale);color:var(--greenDeep)}
.b-blue{background:var(--bluePale);color:var(--blueDeep)}
.b-orange{background:var(--orangePale);color:var(--orangeDeep)}
.b-red{background:var(--dangerPale);color:var(--danger)}
.b-gray{background:var(--grayPale);color:var(--soft)}
.input{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-size:16px}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
.input.err{border-color:var(--danger)}
.input.big{font-size:24px;font-weight:900;min-height:56px}
label.lbl{display:block;font-size:13px;font-weight:900;margin-bottom:6px}
.tile{border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t{font-size:14px;font-weight:900;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:24px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.long{font-size:16px;white-space:normal;line-height:1.3}
.mtile{border-radius:14px;padding:12px;background:var(--cream);display:flex;flex-direction:column;gap:4px}
.mtile .t{font-size:12px;font-weight:900;color:var(--soft)}
.mtile .v{font-size:19px;font-weight:900}
.listrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;background:transparent;width:100%;text-align:left}
.todo{display:flex;align-items:center;gap:12px;padding:10px;min-height:56px;border-radius:14px;background:var(--cream);border:0;width:100%;text-align:left}
.todo .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.chev{color:var(--soft);font-weight:900}
.photo{flex:none;border-radius:14px;display:grid;place-items:center;font-weight:900;text-align:center;line-height:1.1;overflow:hidden}
.photo .h{font-size:22px}
.empty{display:flex;gap:12px;align-items:center;color:var(--soft);font-weight:700;font-size:14px;padding:6px 0}
.center-empty{text-align:center;padding:30px 16px;color:var(--soft)}
.center-empty .big{font-size:40px;margin-bottom:6px}
.notice{font-size:12px;font-weight:800;color:var(--soft)}
.bar{height:8px;border-radius:99px;background:var(--grayPale);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit}
.seg2{display:flex;background:var(--grayPale);border-radius:12px;padding:3px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:10px;min-height:40px;font-weight:900;color:var(--soft)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ===== iPhone 版面 ===== */
.navbar{flex:none;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 12px;background:rgba(251,245,234,.95);border-bottom:1px solid rgba(232,220,203,.8)}
.navbar h1{font-size:18px;margin:0;font-weight:900;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .side{width:76px;display:flex}
.navbar .side.right{justify-content:flex-end}
.navbar .back,.navbar .act{border:0;background:transparent;color:var(--pink);font-weight:900;min-height:44px;padding:0 4px}
.tabbar{flex:none;display:grid;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:900;color:var(--soft);position:relative;min-height:48px;justify-content:center}
.tabbar button .i{font-size:20px;filter:grayscale(1);opacity:.7}
.tabbar button.on{color:var(--pink)}
.tabbar button.on .i{filter:none;opacity:1}
.tabbar .dot{position:absolute;top:2px;left:55%;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px}
.bottombar{flex:none;padding:8px 16px;background:rgba(255,255,255,.92);border-top:1px solid var(--line)}

/* ===== iPad 版面 ===== */
.padwrap{flex:1;display:flex;min-height:0}
.sidebar{width:250px;flex:none;background:#fff;border-right:1.5px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.sidebar .brand{font-size:24px;font-weight:900;color:var(--pink);padding:0 8px 14px}
.sidebar .grp{font-size:12px;font-weight:900;color:var(--soft);padding:12px 10px 4px}
.sidebar .item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:12px;min-height:46px;padding:0 10px;font-weight:900;color:var(--soft);text-align:left}
.sidebar .item.on{background:var(--pinkPale);color:var(--pinkDeep)}
.sidebar .item .n{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.sidebar .acct{margin-top:auto;display:flex;gap:10px;align-items:center;background:var(--cream);border-radius:14px;padding:10px}
.padmain{flex:1;min-width:0;display:flex;flex-direction:column}
.split{flex:1;display:flex;min-height:0}
.split .left{width:390px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
.split .right{flex:1;min-width:0;display:flex;flex-direction:column}
.cartpanel{width:340px;flex:none;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:12px}

/* ===== 彈出畫面 ===== */
.overlay{position:absolute;inset:0;z-index:100;background:rgba(59,50,44,.42);display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:20px}
.sheet{background:var(--cream);width:100%;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.anim{animation:up .2s ease}
.overlay.center .sheet{max-width:640px;border-radius:22px;max-height:92%}
.sheet.short{max-height:62%}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .shead{display:flex;align-items:center;min-height:52px;padding:6px 12px;border-bottom:1px solid var(--line);background:#fff}
.sheet .shead h2{flex:1;text-align:center;margin:0;font-size:17px;font-weight:900}
.sheet .shead .side{width:70px}
.sheet .shead button{border:0;background:transparent;color:var(--pink);font-weight:900;min-height:44px}
.dialog{background:#fff;border-radius:18px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.dialog h3{margin:0;font-size:17px}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:300;max-width:calc(100% - 32px);width:max-content;padding:13px 18px;border-radius:999px;color:#fff;font-weight:900;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center}
.toast.anim{animation:drop .25s ease}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast.success{background:var(--greenDeep)}
.toast.failure{background:var(--danger)}
.toast.info{background:var(--ink)}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 測試任務面板 ===== */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;z-index:600;box-shadow:-10px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0;flex:1;font-size:16px}
.drawer .db{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--cream);font-size:14px;line-height:1.45}
.task input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pink)}
.task.done{opacity:.6}
.task .who{display:inline-block;font-size:11px;font-weight:900;color:var(--pinkDeep);background:var(--pinkPale);border-radius:999px;padding:0 7px;margin-right:4px}
</style>
</head>
<body>

<div class="testbar" id="testbar">
  <b>🧪 UI 測試版</b>
  <div class="seg" role="group" aria-label="預覽尺寸">

    <button data-preview="iphone">iPhone</button>
    <button data-preview="ipad">iPad</button>
  </div>
  <span class="spacer"></span>
  <button class="tbtn pink" data-testid="openTasks" data-tbar="tasks">測試任務</button>

</div>

<div class="stage" id="stage">
  <div class="device" id="device"></div>
</div>

<div class="drawer hidden" id="drawer"></div>

<script>
"use strict";
/* =========================================================================
   Yumeverse 夢次元記帳 — UI 測試版（單一 HTML）
   畫面與規則照 SwiftUI App（Packages/YumeverseCore）。資料只在這個分頁裡，重新整理就重置。
   ========================================================================= */

/* ---------- 小工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000;
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function atDay(offset, hour){ const x = addDays(startOfDay(new Date()), offset); x.setHours(hour||0); return x; }
function daysBetween(a, b){ return Math.round((startOfDay(b) - startOfDay(a)) / DAY); }
const WEEK = ["週日","週一","週二","週三","週四","週五","週六"];
function fmtDay(d){ d = new Date(d); return `${d.getMonth()+1}月${d.getDate()}日（${WEEK[d.getDay()]}）`; }
function fmtTime(d){ d = new Date(d); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function toInputDate(d){ d = new Date(d); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fromInputDate(s){ const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); }
const SYM = {TWD:"NT$", HKD:"HK$"};
function money(n, cur){ if(n === null || n === undefined) return "尚未建立"; return `${SYM[cur||currency()]} ${Number(n).toLocaleString("en-US")}`; }
function uniq(arr){ return [...new Set(arr)]; }
const normalizeFan = s => String(s||"").trim().toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
class RuleError extends Error {}

/* ---------- 測試資料（與 App 的 MockData／SalesMockData 相同） ---------- */

function makeData(){

  ];

const COND = {normal:"正常", damaged:"有損壞", missing:"缺件"};
let D = makeData();

/* ---------- 租借規則（照 LoanBook.swift） ---------- */
const Loan = {
  costume: id => D.costumes.find(c => c.id === id),
  loan: id => D.loans.find(l => l.id === id),
  active: costumeId => [...D.loans].reverse().find(l => l.costumeId === costumeId && l.status !== "returned"),
  order: orderId => D.loans.filter(l => l.orderId === orderId),
  due(l){ if(l.status === "returned") return {k:"returned", text:"已歸還"};
    const d = daysBetween(new Date(), l.dueDate);
    if(d > 0) return {k:"upcoming", d, text: d === 1 ? "明天到期" : `還有 ${d} 天`};
    if(d === 0) return {k:"today", text:"今天到期"};
    return {k:"overdue", d:-d, text:`逾期 ${-d} 天`}; },
  status(c){ const l = Loan.active(c.id); if(l) return Loan.due(l).k === "overdue" ? "overdue" : "onLoan"; return c.suspended ? "suspended" : "available"; },
  available: () => D.costumes.filter(c => Loan.status(c) === "available"),
  activeLoans: () => D.loans.filter(l => l.status !== "returned").sort((a,b) => a.dueDate - b.dueDate),
  finished: () => D.loans.filter(l => l.status === "returned").sort((a,b) => b.returnedAt - a.returnedAt),
  overdue: () => Loan.activeLoans().filter(l => Loan.due(l).k === "overdue"),
  dueSoon: () => Loan.activeLoans().filter(l => { const s = Loan.due(l); return s.k === "today" || (s.k === "upcoming" && s.d <= 1); }),
  history: id => D.loans.filter(l => l.costumeId === id).sort((a,b) => b.lentAt - a.lentAt),
  recentRenters(){ const seen = new Set(), out = [];
    for(const l of [...D.loans].sort((a,b) => b.lentAt - a.lentAt)){ const k = l.renter.name+"|"+(l.renter.phone||""); if(!seen.has(k)){ seen.add(k); out.push(l.renter); } if(out.length === 6) break; }
    return out; },
  lend(ids, renter, due){
    if(!isCompany()) throw new RuleError("這個帳號不能做這個操作。");
    if(!ids.length) throw new RuleError("請至少選一套服裝。");
    const name = renter.name.trim(); if(!name) throw new RuleError("請填寫租借人姓名。");
    if(startOfDay(due) < startOfDay(new Date())) throw new RuleError("歸還日期不能早於今天。");
    for(const id of ids){ const c = Loan.costume(id); const a = Loan.active(id);
      if(a) throw new RuleError(`${c.code} ${c.name} 目前租給 ${a.renter.name}，還沒歸還，不能再出租。`);
      if(c.suspended) throw new RuleError(`${c.code} ${c.name} 暫停出租，請先確認整理完成並恢復可出租。`); }
    D.seq.loan++; const order = `R-NEW-${D.seq.loan}`; const now = new Date();
    ids.forEach((id, i) => D.loans.push({id:`${order}-${i+1}`, orderId:order, costumeId:id, renter:{name, phone:(renter.phone||"").trim() || null},
      lentAt:now, dueDate:startOfDay(due), status:"borrowed", returnedAt:null, condition:null, conditionNote:null, events:[{kind:"lent", at:now, by:S.user.id, note:null}]}));
  },
  confirmReturn(id, cond, note){
    const l = Loan.loan(id); if(!l) throw new RuleError("找不到這筆租借紀錄，請重新整理後再試。");
    if(l.status === "returned") throw new RuleError("這套服裝已經完成歸還。");
    note = (note||"").trim(); if(cond !== "normal" && !note) throw new RuleError("請簡單寫下損壞或缺少的部分。");
    l.status = "returned"; l.returnedAt = new Date(); l.condition = cond; l.conditionNote = note || null;
    const text = [COND[cond], note].filter(Boolean).join("："); l.events.push({kind:"returned", at:new Date(), by:S.user.id, note:text});
    if(cond !== "normal"){ const c = Loan.costume(l.costumeId); c.suspended = true; c.suspendReason = text; }
  },
  resume(id){ const c = Loan.costume(id); c.suspended = false; c.suspendReason = null; }
};

/* ---------- 銷售規則（照 SalesBook.swift） ---------- */
const Sales = {
  event: id => D.events.find(e => e.id === id),
  theme: id => D.themes.find(t => t.id === id),
  product: id => D.products.find(p => p.id === id),
  sale: id => D.sales.find(s => s.id === id),
  member: id => D.members.find(m => m.id === normalizeFan(id)),
  coser: id => COSERS.find(c => c.id === id),
  coserOf: p => Sales.theme(p.themeId)?.coserId,
  visibleThemes: () => isCompany() ? D.themes : D.themes.filter(t => t.coserId === S.user.coserId),
  sellerCosers(){ const ids = new Set(Sales.visibleThemes().map(t => t.coserId)); return COSERS.filter(c => ids.has(c.id)); },
  productsOfCoser(cid){ const tids = new Set(Sales.visibleThemes().filter(t => t.coserId === cid).map(t => t.id)); return D.products.filter(p => tids.has(p.themeId)); },
  visibleProducts(){ const tids = new Set(Sales.visibleThemes().map(t => t.id)); return D.products.filter(p => tids.has(p.themeId)); },
  visibleSales(eventId, coserId){ return D.sales.filter(s => (isCompany() || s.coserId === S.user.coserId) && (!eventId || s.eventId === eventId) && (!coserId || s.coserId === coserId)).slice().reverse(); },
  outstanding(eventId, coserId){ return Sales.visibleSales(eventId, coserId).filter(s => s.status === "outstanding"); },
  lowStock(coserId){ return Sales.visibleProducts().filter(p => !p.digital && p.stock !== null && p.stock <= LOW && (!coserId || Sales.coserOf(p) === coserId)); },
  uncounted(){ return Sales.visibleProducts().filter(p => !p.digital && p.stock === null); },
  reconcile(eventId, coserId){
    const e = Sales.event(eventId); if(!e) return null;
    const list = Sales.visibleSales(eventId, coserId); const paid = list.filter(s => s.status === "paid");
    const by = {}; paid.forEach(s => by[s.payment] = (by[s.payment]||0) + s.total);
    const cash = by.cash || 0; const whole = !coserId;
    const expected = e.opening === null ? null : e.opening + cash;
    const variance = (expected === null || e.actual === null) ? null : e.actual - expected;
    return {currency:e.currency, company:paid.filter(s => s.scope === "company").reduce((a,s) => a+s.total, 0),
      personal:paid.filter(s => s.scope === "personal").reduce((a,s) => a+s.total, 0), by,
      outstanding:list.filter(s => s.status === "outstanding").reduce((a,s) => a+s.total, 0),
      opening: whole ? e.opening : null, cash, expected: whole ? expected : null, actual: whole ? e.actual : null, variance: whole ? variance : null};
  },
  coserSummaries(eventId){
    return Sales.sellerCosers().map(c => { const paid = Sales.visibleSales(eventId, c.id).filter(s => s.status === "paid" && s.scope === "company");
      return {coser:c, total:paid.reduce((a,s) => a+s.total, 0), count:paid.length, items:paid.reduce((a,s) => a+items(s), 0)}; })
      .sort((a,b) => b.total - a.total);
  },
  salesOfMember: id => D.sales.filter(s => s.memberId === normalizeFan(id)).slice().reverse(),
  spending(id){ const r = {}; Sales.salesOfMember(id).filter(s => s.status === "paid").forEach(s => r[s.currency] = (r[s.currency]||0) + s.total); return r; },
  cartTotal(){ const cur = currency(); return S.cart.reduce((a,i) => a + (Sales.product(i.pid).price[cur] || 0) * i.qty, 0); },
  checkout(payment, memberRaw){
    const e = Sales.event(S.eventId); if(!S.cart.length) throw new RuleError("購物車是空的，請先選商品。");
    const lines = []; let coser = null;
    for(const i of S.cart){ const p = Sales.product(i.pid); const owner = Sales.coserOf(p);
      if(!isCompany() && owner !== S.user.coserId) throw new RuleError("這個帳號不能做這個操作。");
      if(coser && coser !== owner) throw new RuleError("一筆交易只能是同一位 Coser 的商品，請先結清目前的購物車。");
      coser = owner; const price = p.price[e.currency];
      if(price === null || price === undefined) throw new RuleError(`「${p.name}」在這個場次還沒有正式售價，不能結帳。`);
      if(!p.digital && p.stock !== null && p.stock < i.qty) throw new RuleError(`「${p.name}」庫存只剩 ${p.stock} 件。`);
      lines.push({pid:p.id, name:p.name, price, qty:i.qty}); }
    const fan = normalizeFan(memberRaw) || null;
    if(payment === "credit" && !fan) throw new RuleError("賒帳要先輸入粉絲 ID，之後才追得到。");
    lines.forEach(l => { const p = Sales.product(l.pid); if(!p.digital && p.stock !== null) p.stock -= l.qty; });
    if(fan && !Sales.member(fan)) D.members.push({id:fan, nickname:"", note:null, createdAt:new Date()});
    D.seq.sale++; const sale = {id:`S-APP-${String(D.seq.sale).padStart(3,"0")}`, eventId:e.id, coserId:coser, at:new Date(), label:"", lines,
      total:lines.reduce((a,l) => a + l.price*l.qty, 0), currency:e.currency, payment, status: payment === "credit" ? "outstanding" : "paid",
      memberId:fan, summary:lines.map(l => `${l.name} ×${l.qty}`).join("・"), scope:"company", source:"App 操作", by:S.user.id};
    D.sales.push(sale); return sale;
  },
  settle(id, method){ const s = Sales.sale(id); if(s.status !== "outstanding") throw new RuleError("這筆款項已經登記收到了。"); s.status = "paid"; s.payment = method; s.settledAt = new Date(); },
  setStock(pid, n){ if(!(n >= 0)) throw new RuleError("請輸入 0 以上的整數金額。"); Sales.product(pid).stock = n; },
  setCash(kind, n){ if(!(n >= 0)) throw new RuleError("請輸入 0 以上的整數金額。"); Sales.event(S.eventId)[kind === "opening" ? "opening" : "actual"] = n; },
  addMember(id, nick, note){ const k = normalizeFan(id); if(!k) throw new RuleError("請輸入粉絲 ID。"); if(Sales.member(k)) throw new RuleError("這個粉絲 ID 已經是會員了。");
    D.members.push({id:k, nickname:nick.trim(), note:note.trim() || null, createdAt:new Date()}); },
  updateMember(id, nick, note){ const m = Sales.member(id); m.nickname = nick.trim(); m.note = note.trim() || null; }
};
const items = s => s.lines.reduce((a,l) => a + l.qty, 0);

function paymentBreakdown(sum){

  const total = Math.max(1, rows.reduce((a,r) => a+r[1], 0));
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px">${sectionTitle("收款方式")}

}

    return sheetFrame("出租服裝", `<div class="page narrow" style="gap:16px">${stepHeader(num(3), total, "什麼時候歸還？", "預設 1 週後，可以直接確認。")}

    const total = Sales.cartTotal(), needFan = L.pay === "credit" && !normalizeFan(S.cartMember), given = parseInt(L.cash || "", 10);

      ${L.pay === "cash" ? `<div><label class="lbl" for="cashGiven">客人給多少？（選填，幫你算找零）</label><input id="cashGiven" class="input big" inputmode="numeric" placeholder="例如 2000" value="${esc(L.cash||"")}" data-input="cashGiven" data-testid="cashGivenField">
        ${given > 0 ? `<div class="strong" style="font-size:19px;margin-top:8px;color:${given>=total?"var(--greenDeep)":"var(--danger)"}">${given>=total ? `找零 ${money(given-total)}` : `還差 ${money(total-given)}`}</div>` : ""}</div>` : ""}
      <div><label class="lbl" for="fanId">${L.pay==="credit"?"粉絲 ID（賒帳必填）":"粉絲 ID（選填，累積會員消費）"}</label>
        <input id="fanId" class="input ${needFan?"err":""}" placeholder="例如 FAN123" value="${esc(S.cartMember)}" data-input="fanId" data-testid="memberIDField" autocapitalize="characters">
        ${mem ? `<div class="small strong" style="color:var(--greenDeep);margin-top:6px">💗 會員：${esc(mem.nickname?`${mem.nickname}（${mem.id}）`:mem.id)}</div>` : fanKey ? `<div class="small muted" style="margin-top:6px">新的粉絲 ID，結帳後會自動建立會員。</div>` : ""}
        <div class="small muted" style="margin-top:4px">會員折扣規則尚未決定，目前不打折。</div></div>
      <button class="btn primary" data-act="paySubmit" data-testid="confirmPaymentButton" ${needFan||S.busy?"disabled":""}>${busyLabel(L.pay==="credit" ? `記成應收 ${money(total)}` : `✓ 確認收款 ${money(total)}`, "處理中…")}</button>
      ${notice()}</div>`, {leftLabel:"返回"});
  }
  if(sh.type === "settle"){
    const s = Sales.sale(sh.id);
    return sheetFrame("登記已收到", `<div class="page narrow" style="gap:12px"><div class="card">${saleRow(s,true)}</div><b>用什麼方式收到的？</b>
      ${["cash","transfer","linePay"].map(k => `<button class="btn" style="background:${PAYCOLOR[k]};color:#fff" data-act="settleWith" data-id="${k}" data-testid="settleWith-${k}" ${S.busy?"disabled":""}>${PAYICON[k]} ${PAY[k]}</button>`).join("")}</div>`, {short:true});
  }
  if(sh.type === "countStock"){
    const p = Sales.product(sh.id);
    return sheetFrame("盤點", `<div class="page narrow" style="gap:14px"><div class="strong" style="font-size:19px">${esc(p.name)}</div>
      <div class="muted sub">目前：${p.stock===null?"未盤點":`${p.stock} 件`}</div><b>實際點到幾件？</b>
      <div class="row"><button class="avatar" style="width:56px;height:56px;border:0;border-radius:50%;background:var(--pinkPale);color:var(--pinkDeep);font-size:26px" data-act="stockStep" data-d="-1" aria-label="減一">−</button>
        <input id="stockCount" class="input big" inputmode="numeric" placeholder="數量" value="${esc(L.text)}" data-input="stockCount" data-testid="stockCountField" style="flex:1;text-align:center">
        <button class="avatar" style="width:56px;height:56px;border:0;border-radius:50%;background:var(--pinkPale);color:var(--pinkDeep);font-size:26px" data-act="stockStep" data-d="1" aria-label="加一">＋</button></div>

      ${field("粉絲 ID（必填）","id","例如 FAN123","memberFormID",editing)}
      ${exists ? `<div class="small strong" style="color:var(--danger)">這個粉絲 ID 已經是會員了。</div>` : ""}
      ${field("暱稱（選填）","nick","例如 小雪","memberFormNickname")}${field("備註（選填）","note","例如 喜歡芙莉蓮","memberFormNote")}
      <button class="btn primary" data-act="memberSave" data-testid="saveMemberButton" ${!can||S.busy?"disabled":""}>${busyLabel(editing?"✓ 儲存":"✓ 新增會員","儲存中…")}</button></div>`);
  }
  return "";
}
function lendDue(L){ const opt = DUE.find(d => d[0] === L.due); return opt[2] ? addDays(new Date(), opt[2]) : fromInputDate(L.custom); }

function renderConfirm(){
  const c = S.confirm; if(!c) return "";
  return `<div class="overlay center"><div class="dialog" role="alertdialog" aria-modal="true"><h3>${esc(c.title)}</h3>${c.message?`<div class="muted sub">${esc(c.message)}</div>`:""}
    <button class="btn ${c.danger?"primary":"green"}" style="${c.danger?"background:var(--danger);box-shadow:none":""}" data-act="confirmOk" data-testid="confirmOk">${esc(c.ok)}</button>
    <button class="btn secondary" data-act="confirmCancel">${esc(c.cancel||"取消")}</button></div></div>`;
}

/* ======================= 外框與導覽 ======================= */
function currentView(){
  const top = S.stack[S.stack.length-1];
  if(top){
    if(top.view === "costumeDetail") return {title:Loan.costume(top.id).code, html:`<div class="scroll">${costumeDetail(top.id)}</div>`};
    if(top.view === "loanDetail") return {title:"租借明細", html:`<div class="scroll">${loanDetail(top.id)}</div>`};
    if(top.view === "memberDetail") return {title:"會員", html:`<div class="scroll">${memberDetail(top.id)}</div>`};
    if(top.view === "section") return sectionView(top.id);
  }
  return sectionView(S.section);
}
function sectionView(sec){
  const t = SECTIONS[sec].title;
  switch(sec){
    case "home": return {title: isCompany() ? "首頁" : "我的首頁", html:`<div class="scroll">${isCompany() ? viewCompanyHome() : viewCoserHome()}</div>`};
    case "checkout": return {title:t, html:viewCheckout(), raw:true};
    case "reconcile": return {title:t, html:`<div class="scroll">${viewReconcile()}</div>`};
    case "mySales": return {title:t, html:`<div class="scroll">${viewMySales()}</div>`};
    case "costumes": return {title:t, html:viewCostumes(), action: `<button class="act" data-act="openLend" data-testid="toolbarLend">＋出租</button>`};
    case "records": return {title:t, html:viewRecords()};
    case "inventory": return {title:t, html:`<div class="scroll">${viewInventory()}</div>`};
    case "members": return {title:t, html:`<div class="scroll">${viewMembers()}</div>`};
    case "more": return {title:t, html:`<div class="scroll">${viewMore()}</div>`};
  }
}
function badgeFor(sec){
  if(sec === "home") return Sales.outstanding().length;
  if(sec === "checkout") return cartCount();
  if(sec === "costumes") return isCompany() ? Loan.overdue().length : 0;
  return 0;
}
/** 彈出畫面與提示只在第一次出現時播放動畫（打字重畫時不要閃） */
let lastSheet = null, lastToast = null;
const anim = {sheet:false, toast:false};
function render(){
  const dev = $("device");
  anim.sheet = !!S.sheet && S.sheet !== lastSheet; lastSheet = S.sheet;
  anim.toast = !!S.toast && S.toast !== lastToast; lastToast = S.toast;
  const focus = document.activeElement && document.activeElement.id && dev.contains(document.activeElement) ? {id:document.activeElement.id, s:document.activeElement.selectionStart, e:document.activeElement.selectionEnd} : null;
  const scrolls = [...dev.querySelectorAll(".scroll")].map(x => x.scrollTop);
  let html;
  if(!S.user) html = viewLogin();
  else {
    const v = currentView();
    if(isPad()){
      const groups = uniq(sectionsFor().map(s => SECTIONS[s].group));
      html = `<div class="padwrap"><nav class="sidebar" aria-label="主要功能"><div class="brand">Yumeverse</div>
        ${groups.map(g => `<div class="grp">${g}</div>${sectionsFor().filter(s => SECTIONS[s].group === g).map(s => { const n = badgeFor(s);
          return `<button class="item ${S.section===s && !S.stack.length?"on":""}" data-act="tab" data-id="${s}" data-testid="sidebar-${s}"><span>${SECTIONS[s].icon}</span>${SECTIONS[s].title}${n?`<span class="n">${n}</span>`:""}</button>`; }).join("")}`).join("")}
        ${isCompany() ? `<div class="grp">快速動作</div><button class="item" style="color:var(--pink)" data-act="openLend">➕ 出租服裝</button>` : ""}
        <div class="acct">${isCompany() ? `<span class="avatar" style="width:38px;height:38px;background:var(--pink)">公</span>` : avatar(Sales.coser(S.user.coserId),38)}<div><div class="strong sub">${esc(S.user.name)}</div><div class="small muted">${isCompany()?"公司":"Coser"}帳號</div></div></div></nav>
        <main class="padmain"><div class="navbar">${S.stack.length ? `<span class="side"><button class="back" data-act="back">‹ 返回</button></span>` : `<span class="side"></span>`}<h1>${esc(v.title)}</h1><span class="side right">${v.action && !S.stack.length ? v.action : ""}</span></div>${v.html}</main></div>`;
    } else {
      const tabs = tabsFor();
      html = `<div class="navbar">${S.stack.length ? `<span class="side"><button class="back" data-act="back">‹ 返回</button></span>` : `<span class="side"></span>`}<h1>${esc(v.title)}</h1><span class="side right">${v.action && !S.stack.length ? v.action : ""}</span></div>
        ${v.html}
        <nav class="tabbar" style="grid-template-columns:repeat(${tabs.length},1fr)" aria-label="分頁">${tabs.map(s => { const n = badgeFor(s);
          return `<button class="${S.section===s?"on":""}" data-act="tab" data-id="${s}" data-testid="tab-${s}"><span class="i">${SECTIONS[s].icon}</span>${SECTIONS[s].short}${n?`<span class="dot">${n}</span>`:""}</button>`; }).join("")}</nav>`;
    }
  }
  html += renderSheet() + renderConfirm();
  if(S.toast) html += `<div class="toast ${S.toast.kind} ${anim.toast?"anim":""}" role="status" data-testid="toast" data-act="toast">${S.toast.kind==="success"?"✔":S.toast.kind==="failure"?"✖":"ⓘ"} ${esc(S.toast.text)}</div>`;
  dev.innerHTML = html;
  const newScrolls = [...dev.querySelectorAll(".scroll")]; newScrolls.forEach((x,i) => { if(scrolls[i] !== undefined && keepScroll) x.scrollTop = scrolls[i]; });
  keepScroll = true;
  if(focus){ const el = $(focus.id); if(el){ el.focus(); try{ el.setSelectionRange(focus.s, focus.e); }catch(_){} } }
}
let keepScroll = true;

/* ---------- 提示與非同步 ---------- */
let toastTimer;
function toast(kind, text){ S.toast = {kind, text}; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, kind === "failure" ? 4000 : 2600);
  if(navigator.vibrate) try{ navigator.vibrate(kind === "failure" ? [40,40,40] : 20); }catch(_){} }
async function perform(fn, success){
  if(S.busy) return false; S.busy = true; render();
  await sleep(450);
  try{ fn(); S.busy = false; if(success) toast("success", success); render(); return true; }
  catch(e){ S.busy = false; toast("failure", e instanceof RuleError ? e.message : "發生錯誤，請再試一次。"); render(); if(!(e instanceof RuleError)) console.error(e); return false; }
}

/* ---------- 導覽動作 ---------- */
function go(section){ S.section = section; S.stack = []; keepScroll = false; S.selCostume = null; S.selLoan = null; }
function jump(section){
  if(isPad() || tabsFor().includes(section)) go(section);
  else { S.stack.push({view:"section", id:section}); keepScroll = false; }
}
function askConfirm(c){ S.confirm = c; render(); }

/* ======================= 事件 ======================= */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act],[data-preview],[data-tbar]"); if(!t) return;
  if(t.dataset.preview){ setPreview(t.dataset.preview); return; }
  if(t.dataset.tbar === "tasks"){ toggleDrawer(); return; }
  if(t.dataset.tbar === "reset"){ if(confirm("要把測試資料重置回初始狀態嗎？（測試任務的勾選不會清掉）")){ const u = S.user; D = makeData(); Object.assign(S, {stack:[], sheet:null, confirm:null, cart:[], cartMember:"", checkoutCoser:null, homeCoser:null, eventId:"test", themeFilter:null}); S.user = u; render(); } return; }
  if(t.disabled) return;
  const a = t.dataset.act, id = t.dataset.id, L = S.sheet && S.sheet.local;
  switch(a){
    case "overlayBg": if(ev.target === t && !S.busy && !(S.sheet && S.sheet.local && S.sheet.local.done)) { S.sheet = null; render(); } return;
    case "toast": S.toast = null; render(); return;
    case "demoLogin": { const acc = ACCOUNTS.find(x => x.id === id); await doLogin(acc.id, acc.password); return; }
    case "login": await doLogin($("acc").value, $("pwd").value); return;
    case "tab": go(id); render(); return;
    case "back": S.stack.pop(); keepScroll = false; render(); return;
    case "push": if(t.dataset.view === "section") S.stack.push({view:"section", id}); else S.stack.push({view:t.dataset.view, id}); keepScroll = false; render(); return;
    case "jump":
      if(t.dataset.prep && S.homeCoser && !S.cart.length) S.checkoutCoser = S.homeCoser;
      if(t.dataset.cfilter) S.costumeFilter = t.dataset.cfilter;
      jump(t.dataset.section); render(); return;
    case "homeCoser": S.homeCoser = id || null; render(); return;
    case "logout": askConfirm({title:"確定要登出嗎？", ok:"登出", danger:true, run(){ S.user = null; S.stack = []; S.cart = []; S.cartMember = ""; S.checkoutCoser = null; S.homeCoser = null; S.section = "home"; }}); return;
    case "confirmOk": { const c = S.confirm; S.confirm = null; if(c.run) await c.run(); render(); return; }
    case "confirmCancel": S.confirm = null; render(); return;
    case "closeSheet": S.sheet = null; render(); return;

    /* 結帳 */
    case "checkoutCoser":
      if(id === activeCoser()) return;
      if(S.cart.length){ const cur = coserName(activeCoser()), nx = coserName(id);
        askConfirm({title:`購物車有 ${cur} 的 ${cartCount()} 件商品，要換成 ${nx} 嗎？`, message:"一筆交易只能是同一位 Coser 的商品。", ok:"清空購物車並切換", danger:true,
          run(){ S.cart = []; S.cartMember = ""; S.checkoutCoser = id; S.themeFilter = null; toast("info", `已清空購物車，改為 ${nx} 的商品`); }}); return; }
      S.checkoutCoser = id; S.themeFilter = null; render(); return;
    case "theme": S.themeFilter = id || null; render(); return;
    case "add": addToCart(id); render(); return;
    case "qty": changeQty(id, Number(t.dataset.d)); render(); return;
    case "clearCart": askConfirm({title:"要清空購物車嗎？", ok:"清空", danger:true, run(){ S.cart = []; S.cartMember = ""; }}); return;
    case "openPayment": S.sheet = {type:"payment", local:{pay:"cash", cash:"", done:null}}; render(); return;
    case "pay": L.pay = id; render(); return;
    case "paySubmit": { let sale; const ok = await perform(() => { sale = Sales.checkout(L.pay, S.cartMember); S.cart = []; S.cartMember = ""; }, null); if(ok){ L.done = sale; render(); } return; }

    /* 對帳 */
    case "cashEntry": { const e = Sales.event(S.eventId), cur = t.dataset.kind === "opening" ? e.opening : e.actual;
      S.sheet = {type:"cash", kind:t.dataset.kind, local:{text: cur === null ? "" : String(cur)}}; render(); return; }
    case "cashSave": { const n = parseInt(L.text, 10), kind = S.sheet.kind;
      if(await perform(() => Sales.setCash(kind, n), `已記錄${kind==="opening"?"起始現金":"收攤實點現金"}`)) { S.sheet = null; render(); } return; }
    case "settle": S.sheet = {type:"settle", id, local:{}}; render(); return;
    case "settleWith": { const sid = S.sheet.id; if(await perform(() => Sales.settle(sid, id), `已登記收到（${PAY[id]}）`)) { S.sheet = null; render(); } return; }

    /* 庫存 */
    case "invCoser": S.invCoser = id || null; render(); return;
    case "invFilter": S.invFilter = id; render(); return;
    case "countStock": { const p = Sales.product(id); S.sheet = {type:"countStock", id, local:{text: p.stock === null ? "" : String(p.stock)}}; render(); return; }
    case "stockStep": L.text = String(Math.max(0, (parseInt(L.text,10) || 0) + Number(t.dataset.d))); render(); return;
    case "stockSave": { const pid = S.sheet.id, n = parseInt(L.text, 10), p = Sales.product(pid);
      if(await perform(() => Sales.setStock(pid, n), `已更新「${p.name}」庫存為 ${n} 件`)) { S.sheet = null; render(); } return; }

    /* 會員 */
    case "memberForm": { const m = id ? Sales.member(id) : null; S.sheet = {type:"member", id: id || null, local:{id: m ? m.id : "", nick: m ? m.nickname : "", note: m && m.note ? m.note : ""}}; render(); return; }
    case "memberSave": { const editing = S.sheet.id, k = normalizeFan(L.id);
      if(await perform(() => editing ? Sales.updateMember(editing, L.nick, L.note) : Sales.addMember(L.id, L.nick, L.note), editing ? "已更新會員資料" : `已新增會員 ${k}`)) { S.sheet = null; render(); } return; }

    /* 服裝租借 */
    case "cfilter": S.costumeFilter = id; render(); return;
    case "cfilterReset": S.costumeFilter = "all"; S.costumeSearch = ""; render(); return;
    case "selCostume": S.selCostume = id; render(); return;
    case "recTab": S.recTab = id; S.selLoan = null; render(); return;
    case "selLoan": S.selLoan = id; render(); return;
    case "openLend": S.sheet = {type:"lend", pre: id || null, local:{step: id ? 2 : 1, selected: id ? [id] : [], name:"", phone:"", due:"week", custom: toInputDate(addDays(new Date(),7)), search:""}}; render(); focusLater("renterName", !!id); return;
    case "lendPick": { const i = L.selected.indexOf(id); if(i >= 0) L.selected.splice(i,1); else L.selected.push(id); render(); return; }
    case "lendNext": L.step = 2; render(); focusLater("renterName", !L.name); return;
    case "lendBack": L.step -= 1; render(); return;
    case "renterPick": { const r = Loan.recentRenters()[Number(t.dataset.i)]; L.name = r.name; L.phone = r.phone || ""; render(); return; }
    case "lendToDate": L.step = 3; render(); return;
    case "lendDue": L.due = id; render(); return;
    case "lendSubmit": { const n = L.selected.length, who = L.name.trim(), first = Loan.costume(L.selected[0]);
      const what = n === 1 ? `${first.code} ${first.name}` : `${n} 套服裝`;
      if(await perform(() => Loan.lend(L.selected, {name:L.name, phone:L.phone}, lendDue(L)), `已出租 ${what} 給 ${who}`)) { S.sheet = null; render(); } return; }
    case "confirmReturn": S.sheet = {type:"confirmReturn", id, local:{checked:[], cond:null, note:""}}; render(); return;
    case "acc": { const i = L.checked.indexOf(id); if(i >= 0) L.checked.splice(i,1); else L.checked.push(id); render(); return; }
    case "cond": { L.cond = id; if(id === "missing" && !L.note && L.checked.length){ const c = Loan.costume(Loan.loan(S.sheet.id).costumeId); const miss = c.accessories.filter(x => !L.checked.includes(x)); if(miss.length) L.note = "缺少：" + miss.join("、"); }
      render(); if(id !== "normal") focusLater("condNote", !L.note); return; }
    case "returnSubmit": { const lid = S.sheet.id, cond = L.cond, note = L.note;
      const msg = cond === "normal" ? "歸還完成，服裝可以再出租" : "歸還完成，服裝已暫停出租，整理好再恢復";
      if(await perform(() => Loan.confirmReturn(lid, cond, note), msg)) { S.sheet = null; render(); } return; }
    case "resume": askConfirm({title:"確定這套服裝已整理好、可以再出租了嗎？", ok:"確定，恢復可出租", cancel:"還沒有", async run(){ await perform(() => Loan.resume(id), "已恢復可出租"); }}); return;
  }
});
document.addEventListener("input", ev => {
  const t = ev.target, k = t.dataset && t.dataset.input; if(!k) return;
  const L = S.sheet && S.sheet.local, v = t.value;
  const digits = () => { const d = v.replace(/\D/g, ""); if(d !== v) t.value = d; return d; };
  switch(k){
    case "costumeSearch": S.costumeSearch = v; break;
    case "recSearch": S.recSearch = v; break;
    case "memberSearch": S.memberSearch = v; break;
    case "lendSearch": L.search = v; break;
    case "renterName": L.name = v; break;
    case "renterPhone": L.phone = v; return;
    case "lendCustom": if(v) L.custom = v; break;
    case "condNote": L.note = v; break;
    case "cashGiven": L.cash = digits(); break;
    case "fanId": S.cartMember = v; break;
    case "stockCount": L.text = digits(); break;
    case "cashAmount": L.text = digits(); break;
    case "m_id": L.id = v; break;
    case "m_nick": L.nick = v; return;
    case "m_note": L.note = v; return;
  }
  render();
});
document.addEventListener("change", ev => {
  if(ev.target.dataset && ev.target.dataset.change === "event"){
    const id = ev.target.value; if(id === S.eventId) return;
    S.eventId = id; S.themeFilter = null;
    if(S.cart.length){ S.cart = []; S.cartMember = ""; toast("info", "已換場次，購物車已清空（售價和幣別可能不同）"); }
    render();
  }
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && ev.target && (ev.target.id === "pwd" || ev.target.id === "acc")) doLogin($("acc").value, $("pwd").value);
  if(ev.key === "Escape" && !S.busy){ if(S.confirm){ S.confirm = null; render(); } else if(S.sheet){ S.sheet = null; render(); } }
});
function focusLater(id, should){ if(should) setTimeout(() => { const el = $(id); if(el) el.focus(); }, 30); }

async function doLogin(acc, pwd){
  acc = (acc||"").trim().toLowerCase();
  if(!acc || !pwd){ S.loginErr = "請輸入帳號和密碼。"; render(); return; }
  S.loginErr = null; S.busy = true; render(); await sleep(350); S.busy = false;
  const a = ACCOUNTS.find(x => x.id === acc && x.password === pwd);
  if(!a){ S.loginErr = "帳號或密碼不正確，可以點上方的測試帳號直接登入。"; render(); return; }
  S.user = a; S.section = "home"; S.stack = []; S.cart = []; S.checkoutCoser = null; S.homeCoser = null; S.costumeFilter = "all"; render();
}
function addToCart(pid){
  const p = Sales.product(pid), price = p.price[currency()];
  if(price === null || price === undefined){ toast("failure", `「${p.name}」在這個場次還沒有正式售價，不能結帳。`); return; }
  if(S.cart.length && Sales.coserOf(Sales.product(S.cart[0].pid)) !== Sales.coserOf(p)){ toast("failure", "一筆交易只能是同一位 Coser 的商品，請先結清目前的購物車。"); return; }
  const q = qtyOf(pid); if(!p.digital && p.stock !== null && q >= p.stock){ toast("failure", p.stock === 0 ? `「${p.name}」已售完。` : `「${p.name}」庫存只剩 ${p.stock} 件。`); return; }
  changeQty(pid, 1);
}
function changeQty(pid, d){ const i = S.cart.findIndex(x => x.pid === pid);
  if(i >= 0){ S.cart[i].qty += d; if(S.cart[i].qty <= 0) S.cart.splice(i,1); } else if(d > 0) S.cart.push({pid, qty:d}); }

/* ======================= 預覽尺寸 ======================= */
function setPreview(mode){
  S.preview = mode; const st = $("stage");
  st.className = "stage" + (mode === "auto" ? "" : ` framed ${mode}`);
  document.querySelectorAll("[data-preview]").forEach(b => b.classList.toggle("on", b.dataset.preview === mode));
  render();
}
let lastPad = null;
new ResizeObserver(() => { const p = isPad(); if(p !== lastPad){ lastPad = p; render(); } }).observe($("device"));

/* ======================= 測試任務面板 ======================= */
const TASKS = [
  ["公司","用「公司管理員」登入，看首頁這個場次的公司收入和待處理。"],
  ["公司","在首頁切換到「小桃」，看數字有沒有跟著變；再切回「全部」。"],
  ["公司","選小桃後按「開始結帳」，賣出 1 個 JK 套組＋2 個簽名拍立得，用 LINE Pay 收款。"],
  ["公司","切到ここあ的商品，用「賒帳」賣 1 本索達寫真書給粉絲 FAN123。"],
  ["公司","到「對帳」輸入起始現金 3000，再輸入收攤實點，看差額。"],
  ["公司","把 FF 退款 1,700 元登記為已收到（轉帳）。"],
  ["公司","一次出租兩套服裝給一位新客人（自己取名字）。"],
  ["公司","收回逾期的 C-30 初音旗袍，狀況選「有損壞」並寫說明。"],
  ["公司","到「商品庫存」把「索達寫真書・單書」盤點為 3 件。"],
  ["公司","新增一位會員 ABC01，暱稱自己取。"],
  ["Coser","登出後用「小桃」登入，確認只看得到自己的商品，並結一筆現金帳。"],
  ["全部","切換上方「iPhone／iPad」預覽，各試一次上面任一個流程。"]
];
const TS = {done:new Set(), notes:"", tester:""};
try{ const raw = localStorage.getItem("yume-ui-test"); if(raw){ const o = JSON.parse(raw); TS.done = new Set(o.done||[]); TS.notes = o.notes||""; TS.tester = o.tester||""; } }catch(_){}
function saveTS(){ try{ localStorage.setItem("yume-ui-test", JSON.stringify({done:[...TS.done], notes:TS.notes, tester:TS.tester})); }catch(_){} }
function renderDrawer(){
  $("drawer").innerHTML = `<div class="dh"><h3>🧪 測試任務</h3><button class="cbtn" style="background:var(--grayPale)" data-drawer="close">關閉</button></div>
  <div class="db">
    <div class="small muted">照順序試試看，做完就勾起來。卡住、看不懂或覺得麻煩的地方，請寫在最下面的意見欄。</div>
    <div><label class="lbl" for="tester">測試者</label><input id="tester" class="input" placeholder="你的名字" value="${esc(TS.tester)}" data-ts="tester"></div>
    ${TASKS.map((t,i) => `<label class="task ${TS.done.has(i)?"done":""}"><input type="checkbox" data-ts="task" data-i="${i}" ${TS.done.has(i)?"checked":""}><span><span class="who">${t[0]}</span>${i+1}. ${esc(t[1])}</span></label>`).join("")}
    <div><label class="lbl" for="tsNotes">意見（哪裡卡住、看不懂、太多步驟）</label><textarea id="tsNotes" class="input" style="min-height:140px" data-ts="notes" placeholder="例如：任務 4 找不到賒帳在哪裡">${esc(TS.notes)}</textarea></div>
    <button class="btn primary" data-drawer="copy">📋 複製測試結果</button>
    <div class="small muted">按下後會把勾選結果和意見複製起來，貼到 LINE 或 Email 傳給公司即可。</div>
  </div>`;
}
function toggleDrawer(){ const d = $("drawer"); if(d.classList.contains("hidden")){ renderDrawer(); d.classList.remove("hidden"); } else d.classList.add("hidden"); }
$("drawer").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-drawer]"); if(!b) return;
  if(b.dataset.drawer === "close") $("drawer").classList.add("hidden");
  if(b.dataset.drawer === "copy"){
    const text = [`Yumeverse UI 測試結果（${new Date().toLocaleString("zh-TW")}）`, `測試者：${TS.tester || "未填"}`, `預覽：${S.preview}・畫面寬 ${$("device").clientWidth}px`, "",
      ...TASKS.map((t,i) => `${TS.done.has(i) ? "☑" : "☐"} ${i+1}. ${t[1]}`), "", "意見：", TS.notes || "（無）"].join("\n");
    try{ await navigator.clipboard.writeText(text); b.textContent = "✔ 已複製"; }
    catch(_){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); b.textContent = "✔ 已複製"; }
    setTimeout(() => { b.textContent = "📋 複製測試結果"; }, 1800);
  }
});
$("drawer").addEventListener("input", ev => { const t = ev.target;
  if(t.dataset.ts === "notes") TS.notes = t.value; if(t.dataset.ts === "tester") TS.tester = t.value; saveTS(); });
$("drawer").addEventListener("change", ev => { const t = ev.target;
  if(t.dataset.ts === "task"){ const i = Number(t.dataset.i); if(t.checked) TS.done.add(i); else TS.done.delete(i); t.closest(".task").classList.toggle("done", t.checked); saveTS(); } });

render();
</script>
